<div class="h-[calc(100vh-160px)] flex flex-col items-center justify-center animate-fade-in relative z-10 w-full overflow-hidden px-4">
    <!-- Magic Link Container -->
    <div class="w-full max-w-md bg-surface-container-high rounded-sm shadow-2xl border border-white/10 p-10 relative overflow-hidden backdrop-blur-md">
        
        <!-- Decorative Glow -->
        <div class="absolute -top-32 -right-32 w-64 h-64 bg-primary/20 rounded-full blur-[100px] pointer-events-none"></div>

        <header class="text-center space-y-3 mb-10 relative z-10">
            <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-primary to-purple-600 flex items-center justify-center mx-auto shadow-lg mb-6">
                <span class="material-symbols-outlined text-black text-2xl" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
            </div>
            <h1 class="text-3xl font-bold font-headline tracking-tighter text-white">Xác thực hệ thống</h1>
            <p class="text-sm text-neutral-400 font-body">Đăng nhập không mật khẩu (Magic Link Auth) đảm bảo an toàn tuyệt đối qua Node.js & Go Worker.</p>
        </header>

        <form class="space-y-6 relative z-10" onsubmit="event.preventDefault(); this.querySelector('button').innerText = 'Check Your Email'; this.querySelector('button').classList.add('bg-green-500', 'text-white'); this.querySelector('button').classList.remove('bg-primary', 'text-black');">
            <!-- Email Input -->
            <div class="space-y-2">
                <label class="block text-[10px] font-bold uppercase tracking-widest text-primary" for="email">
                    Địa chỉ Email
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-neutral-500">
                        <span class="material-symbols-outlined text-sm">mail</span>
                    </span>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full bg-surface-container-low border border-white/10 rounded-sm py-4 pl-11 pr-4 text-sm focus:ring-1 focus:ring-primary/50 transition-all font-body outline-none placeholder:text-zinc-600 text-white" 
                        placeholder="admin@tkien.dev" 
                        required
                    />
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-primary hover:bg-primary-dim text-black font-bold text-xs py-4 rounded-sm transition-all focus:scale-[0.98] uppercase tracking-widest flex items-center justify-center gap-2 group">
                <span class="material-symbols-outlined text-sm group-hover:rotate-12 transition-transform">bolt</span>
                Gửi Magic Link Token
            </button>
        </form>

        <footer class="mt-8 text-center border-t border-white/5 pt-6 relative z-10">
            <p class="text-[10px] text-neutral-500 uppercase tracking-wider font-mono">
                Bảo vệ bởi JWT & AES-256
            </p>
        </footer>
    </div>
</div>
